<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | ExamSarthi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Exam-Sarthi/frontend/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-logo" href="/Exam-Sarthi/frontend/home.html">
        <img src="/Exam-Sarthi/frontend/assets/logo.svg" alt="ExamSarthi logo">
      </a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="exams.html">Exams</a>
        <a href="analytics.html">Analytics</a>
        <a class="active" href="settings.html">Settings</a>
        <a href="login.html" id="logoutLink">Logout</a>
      </nav>
    </aside>
    <main class="app-content">
      <div class="topbar">
        <div>
          <p class="text-secondary mb-1">Account preferences</p>
          <h1 class="h3 fw-bold mb-0">Settings</h1>
        </div>
      </div>

      <section class="content-card">
        <div id="settingsAlert" class="alert d-none" role="alert"></div>
        <form id="settingsForm" class="row g-3">
          <div class="col-md-6">
            <label for="settingsName" class="form-label">Full Name</label>
            <input type="text" class="form-control rounded-pill" id="settingsName">
          </div>
          <div class="col-md-6">
            <label for="settingsEmail" class="form-label">Email</label>
            <input type="email" class="form-control rounded-pill" id="settingsEmail" disabled>
          </div>
          <div class="col-md-6">
            <label for="targetExam" class="form-label">Target Exam</label>
            <select class="form-select rounded-pill" id="targetExam">
              <option>JEE</option>
              <option>NEET</option>
              <option>GATE</option>
              <option>MHTCET</option>
              <option>NDA</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="dailyGoal" class="form-label">Daily Study Goal</label>
            <select class="form-select rounded-pill" id="dailyGoal">
              <option>1 hour</option>
              <option>2 hours</option>
              <option>3 hours</option>
              <option>4+ hours</option>
            </select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary rounded-pill px-4">Save Settings</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="/Exam-Sarthi/frontend/js/main.js"></script>
  <script src="/Exam-Sarthi/frontend/js/settings.js"></script>
</body>
</html>
