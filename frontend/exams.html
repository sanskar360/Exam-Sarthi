<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Exams | ExamSarthi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Exam-Sarthi/frontend/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-logo" href="index.html">
        <img src="/Exam-Sarthi/frontend/assets/logo.svg" alt="ExamSarthi logo">
      </a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="exams.html">Exams</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
        <a href="login.html" id="logoutLink">Logout</a>
      </nav>
    </aside>
    <main class="app-content">
      <div class="topbar">
        <div>
          <p class="text-secondary mb-1">Practice library</p>
          <h1 class="h3 fw-bold mb-0">Mock Exams</h1>
        </div>
      </div>

      <div class="content-card mb-4">
        <input id="examSearch" class="form-control rounded-pill" type="search" placeholder="Search mock tests">
        <div class="filter-row mt-3">
          <button class="btn btn-primary rounded-pill filter-btn" data-filter="all">All</button>
          <button class="btn btn-outline-primary rounded-pill filter-btn" data-filter="JEE">JEE</button>
          <button class="btn btn-outline-primary rounded-pill filter-btn" data-filter="NEET">NEET</button>
          <button class="btn btn-outline-primary rounded-pill filter-btn" data-filter="GATE">GATE</button>
          <button class="btn btn-outline-primary rounded-pill filter-btn" data-filter="MHTCET">MHTCET</button>
          <button class="btn btn-outline-primary rounded-pill filter-btn" data-filter="NDA">NDA</button>
        </div>
      </div>

      <section id="examCards" class="row g-4"></section>
    </main>
  </div>
  <script src="/Exam-Sarthi/frontend/js/main.js"></script>
  <script src="/Exam-Sarthi/frontend/js/exams.js"></script>
</body>
</html>
