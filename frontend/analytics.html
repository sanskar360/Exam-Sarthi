<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | ExamSarthi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Exam-Sarthi/frontend/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-logo" href="/Exam-Sarthi/frontend/home.html">
        <img src="/Exam-Sarthi/frontend/assets/logo.svg" alt="ExamSarthi logo">
      </a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="exams.html">Exams</a>
        <a class="active" href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
        <a href="login.html" id="logoutLink">Logout</a>
      </nav>
    </aside>
    <main class="app-content">
      <div class="topbar">
        <div>
          <p class="text-secondary mb-1">Performance review</p>
          <h1 class="h3 fw-bold mb-0">Analytics</h1>
        </div>
        <a class="btn btn-primary rounded-pill" href="exams.html">Take New Test</a>
      </div>

      <section class="row g-4 mt-1">
        <div class="col-md-4"><div class="stat-card stat-blue"><p>Accuracy</p><h2 id="accuracyCard">0%</h2></div></div>
        <div class="col-md-4"><div class="stat-card stat-green"><p>Rank Prediction</p><h2 id="rankCard">Top 35%</h2></div></div>
        <div class="col-md-4"><div class="stat-card stat-orange"><p>Total Score</p><h2 id="scoreCard">0</h2></div></div>
      </section>

      <section class="row g-4 mt-1">
        <div class="col-lg-8">
          <div class="content-card">
            <h2 class="h5 fw-bold">Test Score Line Graph</h2>
            <canvas id="scoreLineChart" height="130"></canvas>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="content-card">
            <h2 class="h5 fw-bold">Accuracy Pie Chart</h2>
            <canvas id="accuracyPieChart" height="220"></canvas>
          </div>
        </div>
        <div class="col-12">
          <div class="content-card">
            <h2 class="h5 fw-bold">Performance Trend</h2>
            <canvas id="trendChart" height="90"></canvas>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/Exam-Sarthi/frontend/js/main.js"></script>
  <script src="/Exam-Sarthi/frontend/js/analytics.js"></script>
</body>
</html>
