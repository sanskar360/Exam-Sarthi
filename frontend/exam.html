<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attempt Exam | ExamSarthi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Exam-Sarthi/frontend/static/style.css">
</head>
<body class="exam-body">
  <header class="exam-header">
    <a class="brand-logo" href="dashboard.html">
      <img src="/Exam-Sarthi/frontend/assets/logo.svg" alt="ExamSarthi logo">
    </a>
    <div class="timer" id="examTimer">20:00</div>
    <button class="btn btn-outline-danger rounded-pill" id="endExamBtn">End Exam</button>
  </header>

  <main class="container py-4">
    <div class="row g-4">
      <section class="col-lg-8">
        <div class="content-card question-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h5 fw-bold mb-0" id="examTitle">Mock Test</h1>
            <span class="badge text-bg-light" id="questionCounter">Question 1 of 5</span>
          </div>
          <h2 class="h5 question-text" id="questionText"></h2>
          <div id="optionsList" class="options-list"></div>
          <div class="d-flex justify-content-between gap-3 mt-4">
            <button class="btn btn-outline-primary rounded-pill px-4" id="prevBtn">Previous</button>
            <button class="btn btn-primary rounded-pill px-4" id="nextBtn">Next</button>
          </div>
        </div>
      </section>
      <aside class="col-lg-4">
        <div class="content-card">
          <h2 class="h5 fw-bold">Question Palette</h2>
          <div id="questionPalette" class="palette-grid"></div>
          <div class="palette-help mt-3">
            <span><b class="answered-dot"></b> Answered</span>
            <span><b class="unanswered-dot"></b> Unanswered</span>
          </div>
          <button class="btn btn-success w-100 rounded-pill mt-4" id="submitTestBtn">Submit Test</button>
        </div>
      </aside>
    </div>
  </main>

  <script src="/Exam-Sarthi/frontend/js/main.js"></script>
  <script src="/Exam-Sarthi/frontend/js/exam.js"></script>
</body>
</html>
