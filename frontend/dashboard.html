<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | ExamSarthi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Exam-Sarthi/frontend/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="sidebar-logo" href="/Exam-Sarthi/frontend/home.html">
        <img src="/Exam-Sarthi/frontend/assets/logo.svg" alt="ExamSarthi logo">
      </a>
      <nav>
        <a class="active" href="dashboard.html">Dashboard</a>
        <a href="exams.html">Exams</a>
        <a href="analytics.html">Analytics</a>
        <a href="settings.html">Settings</a>
        <a id="logoutLink" onclick="logout()">Logout</a>
      </nav>
    </aside>
    <main class="app-content">
      <div class="topbar">
        <div>
          <p class="text-secondary mb-1">Welcome back</p>
          <h1 class="h3 fw-bold mb-0" id="dashboardName">Student</h1>
        </div>
        <a class="btn btn-primary rounded-pill" href="exams.html">Browse Exams</a>
      </div>

      <section class="row g-4 mt-1">
        <div class="col-md-4">
          <div class="stat-card stat-blue">
            <p>Average Score</p>
            <h2 id="avgScore">0%</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card stat-green">
            <p>Exams Taken</p>
            <h2 id="examsTaken">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card stat-orange">
            <p>Study Streak</p>
            <h2>5 days</h2>
          </div>
        </div>
      </section>

      <section class="row g-4 mt-1">
        <div class="col-lg-7">
          <div class="content-card">
            <h2 class="h5 fw-bold">Weekly Activity</h2>
            <canvas id="weeklyChart" height="140"></canvas>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="content-card">
            <h2 class="h5 fw-bold">Recent Tests</h2>
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr><th>Exam</th><th>Score</th><th>Date</th></tr>
                </thead>
                <tbody id="recentTestsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/Exam-Sarthi/frontend/js/main.js"></script>
  <script src="/Exam-Sarthi/frontend/js/dashboard.js"></script>
  <script src="/Exam-Sarthi/backend/auth/logout.js"></script>
</body>
</html>
